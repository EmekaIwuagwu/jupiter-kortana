version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  relayer:
    build:
      context: ./relayer
    ports:
      - "3001:3001"
    env_file:
      - ./relayer/.env
    volumes:
      - ./relayer:/app
      - /app/node_modules
